name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Falls back to the default GITHUB_TOKEN, which can only see this
          # one repo. Add a repo secret named METRICS_TOKEN (a classic PAT
          # with "repo" and "read:user" scopes) to get real language/activity
          # data from your other repositories instead of an empty report.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          template: terminal
          base: header, metadata
          config_timezone: Asia/Jakarta

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes
