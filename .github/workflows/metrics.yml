name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Falls back to the default GITHUB_TOKEN, but for full
          # stats (private contributions, higher rate limits) add
          # a repo secret named METRICS_TOKEN with a PAT that has
          # the "repo" and "read:user" scopes.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_achievements: yes
          plugin_achievements_threshold: C

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
