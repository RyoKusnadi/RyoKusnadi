<svg xmlns="http://www.w3.org/2000/svg" width="115" height="115" viewBox="0 0 115 115" fill="none">
  <style>
    .card { opacity: 0; transform-origin: 57.5px 57.5px; animation: pop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1.15) 0.84s forwards; }
    .icon { transform-origin: 57.5px 50px; animation: float 3.2s ease-in-out 1.64s infinite; }
    .shine { animation: sweep 4.5s ease-in-out 2.04s infinite; transform: translateX(-90px); }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes sweep { 0% { transform: translateX(-90px); } 35%, 100% { transform: translateX(190px); } }
    @media (prefers-reduced-motion: reduce) {
      .card, .icon, .shine { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <defs>
    <clipPath id="card-clip"><rect x="0.5" y="0.5" rx="4.5" width="114" height="114" /></clipPath>
    <linearGradient id="shine-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g class="card">
          <rect
            x="0.5"
            y="0.5"
            rx="4.5"
            width="114"
            height="114"
            stroke="#e1e4e8"
            fill="#1a1b27"
            stroke-opacity="1"
            fill-opacity="1"
          />
    <g class="icon">
          
  
  
  <defs>
    <linearGradient id="C" gradientTransform="rotate(45)">
    
      <stop offset="0%" stop-color="#5c75c3"/>
      <stop offset="50%" stop-color="#5c75c3"/>
      <stop offset="100%" stop-color="#6272a4"/>
  
    </linearGradient>
  </defs>
  <svg x="28" y="20" width="100" height="100" viewBox="0 0 30 30" fill="url(#C)" xmlns="http://www.w3.org/2000/svg">
    
    <path d="M7 10h2v4H7v-4z"/>
    <path d="M10 11c0 .552-.895 1-2 1s-2-.448-2-1 .895-1 2-1 2 .448 2 1z"/>
    <path fill-rule="evenodd" d="M12.5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 2a3 3 0 1 1 6 0 3 3 0 0 1-6 0zm-6-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 2a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"/>
    <path d="M3 1h10c-.495 3.467-.5 10-5 10S3.495 4.467 3 1zm0 15a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1H3zm2-1a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1H5z"/>
    <circle cx="8" cy="6" r="4" fill="#bf91f3" />
    <text x="6" y="8" font-family="Courier, Monospace" font-size="7" fill="#0d1117">C</text>
  
  </svg>
  
          </g>
<text x="50%" y="18" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji" font-weight="bold" font-size="13" fill="#70a5fd">Issues</text>
          <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji" font-weight="bold" font-size="10.5" fill="#38bdae">First Issue</text>
          <text x="50%" y="97" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji" font-weight="bold" font-size="10" fill="#38bdae">3pt</text>
          
    <style>
    @keyframes IssuesRankAnimation {
      from {
        width: 0px;
      }
      to {
        width: 17.77777777777778px;
      }
    }
    #Issues-rank-progress{
      animation: IssuesRankAnimation 1.2s 1.29s forwards ease-in-out;
    }
    </style>
    <rect
      x="15"
      y="101"
      rx="1"
      width="80"
      height="3.2"
      opacity="0.3"
      fill="#00aeff"
    />
    <rect
      id="Issues-rank-progress"
      x="15"
      y="101"
      rx="1"
      height="3.2"
      fill="#00aeff"
    />
  
  </g>
</svg>
