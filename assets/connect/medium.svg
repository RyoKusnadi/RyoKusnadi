<svg xmlns="http://www.w3.org/2000/svg" width="176" height="44" viewBox="0 0 176 44" role="img" aria-label="MEDIUM">
  <title>MEDIUM</title>
  <style>
    .btn { opacity: 0; transform-origin: 88px 22px; animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.15) 0.15s forwards; }
    .bg { animation: hue 6s ease-in-out 0.75s infinite; }
    .icon { transform-origin: 26px 22px; animation: nudge 3s ease-in-out 1.05s infinite; }
    .shine { transform: translateX(-80px); animation: sweep 4s ease-in-out 1.15s infinite; }
    .arrow { opacity: 0.55; animation: slide 1.8s ease-in-out 0.95s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.95); } to { opacity: 1; transform: none; } }
    @keyframes hue { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes nudge { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-10deg) scale(1.08); } 88% { transform: rotate(8deg) scale(1.08); } }
    @keyframes sweep { 0% { transform: translateX(-80px); } 40%, 100% { transform: translateX(236px); } }
    @keyframes slide { 0%, 100% { transform: translateX(0); opacity: 0.4; } 50% { transform: translateX(4px); opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) {
      .btn, .bg, .icon, .shine, .arrow { animation: none; opacity: 1; transform: none; }
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100E" />
      <stop offset="1" stop-color="#3d3a36" />
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="clip"><rect width="176" height="44" rx="8" /></clipPath>
  </defs>
  <g class="btn">
    <g clip-path="url(#clip)">
      <rect width="176" height="44" fill="#12100E" />
      <rect class="bg" width="176" height="44" fill="url(#bg)" />
      <g transform="rotate(20 88 22)">
        <rect class="shine" x="0" y="-60" width="40" height="164" fill="url(#shine)" />
      </g>
    </g>
    <rect x="0.5" y="0.5" width="175" height="43" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" />
    <g class="icon">
      <svg x="15" y="11" width="22" height="22" viewBox="0 0 24 24"><path fill="#ffffff" d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z" /></svg>
    </g>
    <text x="99" y="27.5" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">MEDIUM</text>
    <g class="arrow">
      <path d="M154 17 l5 5 -5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
