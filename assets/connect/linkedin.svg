<svg xmlns="http://www.w3.org/2000/svg" width="176" height="44" viewBox="0 0 176 44" role="img" aria-label="LINKEDIN">
  <title>LINKEDIN</title>
  <style>
    .btn { opacity: 0; transform-origin: 88px 22px; animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.15) 0.00s forwards; }
    .bg { animation: hue 6s ease-in-out 0.60s infinite; }
    .icon { transform-origin: 26px 22px; animation: nudge 3s ease-in-out 0.90s infinite; }
    .shine { transform: translateX(-80px); animation: sweep 4s ease-in-out 1.00s infinite; }
    .arrow { opacity: 0.55; animation: slide 1.8s ease-in-out 0.80s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.95); } to { opacity: 1; transform: none; } }
    @keyframes hue { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes nudge { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-10deg) scale(1.08); } 88% { transform: rotate(8deg) scale(1.08); } }
    @keyframes sweep { 0% { transform: translateX(-80px); } 40%, 100% { transform: translateX(236px); } }
    @keyframes slide { 0%, 100% { transform: translateX(0); opacity: 0.4; } 50% { transform: translateX(4px); opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) {
      .btn, .bg, .icon, .shine, .arrow { animation: none; opacity: 1; transform: none; }
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2" />
      <stop offset="1" stop-color="#0E86E8" />
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="clip"><rect width="176" height="44" rx="8" /></clipPath>
  </defs>
  <g class="btn">
    <g clip-path="url(#clip)">
      <rect width="176" height="44" fill="#0A66C2" />
      <rect class="bg" width="176" height="44" fill="url(#bg)" />
      <g transform="rotate(20 88 22)">
        <rect class="shine" x="0" y="-60" width="40" height="164" fill="url(#shine)" />
      </g>
    </g>
    <rect x="0.5" y="0.5" width="175" height="43" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" />
    <g class="icon">
      <svg x="15" y="11" width="22" height="22" viewBox="0 0 24 24"><path fill="#ffffff" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" /></svg>
    </g>
    <text x="99" y="27.5" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">LINKEDIN</text>
    <g class="arrow">
      <path d="M154 17 l5 5 -5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
